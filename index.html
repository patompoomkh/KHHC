/* =================== ผลตรวจอาชีวอนามัย (การมองเห็น / การได้ยิน / ปอด) =================== */
const OCC_FAR = [["both", "สองตา"], ["right", "ขวา"], ["left", "ซ้าย"], ["depth", "ภาพ 3 มิติ"], ["color", "จำแนกสี"], ["vert", "แนวตั้ง"], ["horiz", "แนวนอน"]];
const OCC_NEAR = [["both", "สองตา"], ["right", "ขวา"], ["left", "ซ้าย"], ["horiz", "แนวนอน"]];
const OCC_FIELD = [["right", "ขวา"], ["left", "ซ้าย"]];
const HZ = [500, 1000, 2000, 3000, 4000, 6000, 8000];
const occEmpty = () => ({ date: todayKey(), vision: { far: {}, near: {}, field: {}, result: "", summary: "" }, hearing: { right: {}, left: {}, result: "", summary: "", img: "" }, lung: { fvc: {}, ratio: {}, result: "", summary: "", img: "" }, note: "" });
const resultTag = r => r === "normal" ? `<span class="tag ok">ปกติ</span>` : r === "abnormal" ? `<span class="tag bad">ผิดปกติ</span>` : r === "followup" ? `<span class="tag warn">ติดตาม/ส่งต่อ</span>` : `<span class="tag">ยังไม่สรุป</span>`;
const pctOf = (o) => { const m = num(o.meas), p = num(o.pred); return num(o.pct) || (m > 0 && p > 0 ? Math.round(m / p * 1000) / 10 : 0); };

function hearingAvg(ear) {
  const v = k => (ear[k] === "" || ear[k] == null) ? null : num(ear[k], null);
  const avg = ks => { const xs = ks.map(v).filter(x => x != null); return xs.length === ks.length ? Math.round(xs.reduce((a, b) => a + b, 0) / xs.length * 10) / 10 : null; };
  return { low: avg([500, 1000, 2000]), high: avg([3000, 4000, 6000]) };
}
function lungHint(l) {
  const f = pctOf(l.fvc || {}), r = num((l.ratio || {}).meas);
  if (!f && !r) return "";
  const restrict = f > 0 && f < 80, obstr = r > 0 && r < 70;
  const t = restrict && obstr ? "รูปแบบผสม (Mixed)" : restrict ? "อาจเป็นแบบจำกัดการขยายตัว (Restrictive)" : obstr ? "อาจเป็นแบบอุดกั้น (Obstructive)" : "อยู่ในเกณฑ์ปกติ";
  return `<span class="tag ${restrict || obstr ? "warn" : "ok"}">แนวโน้ม: ${t}</span>`;
}

/* ---- กราฟการได้ยิน (Audiogram) ---- */
function audiogramSVG(right, left) {
  const W = 560, H = 330, P = { l: 46, r: 16, t: 38, b: 34 };
  const xOf = f => P.l + Math.log2(f / 500) / 4 * (W - P.l - P.r);
  const yOf = db => P.t + (db + 10) / 130 * (H - P.t - P.b);
  const pts = ear => HZ.filter(f => ear && ear[f] !== "" && ear[f] != null && Number.isFinite(parseFloat(ear[f]))).map(f => [xOf(f), yOf(num(ear[f]))]);
  const R = pts(right), L = pts(left);
  let g = `<rect x="${P.l}" y="${yOf(-10)}" width="${W - P.l - P.r}" height="${yOf(25) - yOf(-10)}" fill="#E3F5EC" opacity=".7"/>`;
  for (let db = -10; db <= 120; db += 10) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yOf(db)}" y2="${yOf(db)}" stroke="${db === 25 ? "#2F9E6E" : "#EFEDF1"}" ${db === 25 ? 'stroke-dasharray="5 4"' : ""}/><text x="${P.l - 6}" y="${yOf(db) + 4}" font-size="10.5" text-anchor="end" fill="#8A8492">${db}</text>`;
  HZ.forEach(f => g += `<line x1="${xOf(f)}" x2="${xOf(f)}" y1="${yOf(-10)}" y2="${yOf(120)}" stroke="#EFEDF1"/><text x="${xOf(f)}" y="${P.t - 9}" font-size="10.5" text-anchor="middle" fill="#8A8492">${f >= 1000 ? f / 1000 + "k" : f}</text>`);
  const line = (ps, c, dash) => ps.length > 1 ? `<polyline points="${ps.map(p => p.join(",")).join(" ")}" fill="none" stroke="${c}" stroke-width="2" ${dash ? 'stroke-dasharray="6 4"' : ""}/>` : "";
  g += line(R, "#C2414B") + line(L, "#2B6CB0", true);
  g += R.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="6" fill="#fff" stroke="#C2414B" stroke-width="2.2"/>`).join("");
  g += L.map(([x, y]) => `<path d="M${x - 5} ${y - 5}L${x + 5} ${y + 5}M${x + 5} ${y - 5}L${x - 5} ${y + 5}" stroke="#2B6CB0" stroke-width="2.4"/>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟการได้ยิน">
    <text x="${W - P.r}" y="12" font-size="11" text-anchor="end" fill="#8A8492">ความถี่ (Hz)</text>
    <text x="10" y="${H / 2}" font-size="11" fill="#8A8492" transform="rotate(-90 10 ${H / 2})" text-anchor="middle">ระดับการได้ยิน (dB HL)</text>
    ${g}
    <text x="${W - P.r}" y="${H - 8}" font-size="11.5" text-anchor="end"><tspan fill="#C2414B">○ หูขวา</tspan>   <tspan fill="#2B6CB0">✕ หูซ้าย</tspan>   <tspan fill="#2F9E6E">┄ เกณฑ์ปกติ ≤ 25 dB</tspan></text>
  </svg></div>`;
}
/* ---- กราฟสมรรถภาพปอด: %Pred เทียบเกณฑ์ ---- */
function lungSVG(l) {
  const f = pctOf(l.fvc || {}), rp = pctOf(l.ratio || {}), rm = num((l.ratio || {}).meas);
  if (!f && !rp && !rm) return "";
  const W = 560, H = 150, X0 = 150, X1 = W - 30, max = 140;
  const x = v => X0 + Math.min(v, max) / max * (X1 - X0);
  const bar = (y, label, v, cut, unit) => v ? `<text x="${X0 - 10}" y="${y + 15}" text-anchor="end" font-size="12.5" fill="#4D4855">${label}</text>
    <rect x="${X0}" y="${y}" width="${x(v) - X0}" height="22" rx="5" fill="${v >= cut ? "#7FC8A0" : "#F0A0A8"}"/>
    <text x="${x(v) + 6}" y="${y + 16}" font-size="12.5" font-weight="700" fill="#2E2A33">${fmt(v)}${unit}</text>
    <line x1="${x(cut)}" x2="${x(cut)}" y1="${y - 4}" y2="${y + 26}" stroke="#2E2A33" stroke-dasharray="3 3"/><text x="${x(cut)}" y="${y - 7}" font-size="10" text-anchor="middle" fill="#4D4855">เกณฑ์ ${cut}${unit}</text>` : "";
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟสมรรถภาพปอด">
    ${bar(22, "FVC (%Pred)", f, 80, "%")}${bar(84, "FEV1/FVC (Meas.)", rm, 70, "%")}
  </svg></div>`;
}

function readOccForm(form, base) {

/* =================== ภาพประกอบท่าทาง (วาดด้วย SVG) =================== */
const D2R = Math.PI / 180;

/* ท่ายืน (มองด้านข้าง หันขวา) */
function figStand(o = {}) {

  let g = `<line x1="8" x2="92" y1="${ground}" y2="${ground}" stroke="#D8D3DE" stroke-width="2"/>`;
  if (hl.includes("trunk")) g += refLine(H, 30) + arc(H, 14, 0, t, true);

async function saveFile(filename, blob) {
  if (Store.downloads) {
    try { await Store.downloads.save({ filename, data: blob }); toast("ดาวน์โหลดแล้ว", "ok"); return true; }
    catch (e) { if (e && e.code === "declined") return false; if (e && e.code !== "unavailable") { toast("ดาวน์โหลดไม่สำเร็จ", "bad"); return false; } }
  }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true; }
  catch (e) { toast("อุปกรณ์นี้ไม่รองรับการดาวน์โหลด", "bad"); return false; }
}

/* =================== History (audit + restore) =================== */
function stripSame(before, after) {
  const b = before ? { ...before } : null, a = after ? { ...after } : null;
  if (b && a && b.image === a.image) { delete b.image; delete a.image; }
  return [b, a];
}
async function logHistory(kind, docId, action, before, after, summary) {
  const [b, a] = stripSame(before, after);
  const rec = { at: Date.now(), by: S.uid, kind, docId, action, before: b, after: a, summary: summary || "" };
  try { await Store.set("history/" + uid8(), rec); } catch (e) { console.warn("history", e); }
}
async function writeEntity(kind, id, data, before, summary) {
  const rec = { ...data, updatedAt: Date.now(), updatedBy: S.uid };
  delete rec.id;
  await Store.set(`${kind}/${id}`, rec);
  await logHistory(kind, id, before ? "update" : "create", before ? stripId(before) : null, rec, summary);
  return rec;
}
async function removeEntity(kind, id, before, summary) {
  await Store.del(`${kind}/${id}`);
  await logHistory(kind, id, "delete", stripId(before), null, summary);
}
const stripId = o => { if (!o) return o; const c = { ...o }; delete c.id; return c; };

  const catRows = sheet("หมวดอาหาร") || [];
  const foodRows = sheet("รายการอาหาร") || (wb.SheetNames.length === 1 ? sheet(wb.SheetNames[0]) : null);
  const menuRowsIn = sheet("เมนูอาหาร");
  if (!foodRows && !menuRowsIn) { toast("ไม่พบแผ่นงาน “รายการอาหาร” หรือ “เมนูอาหาร”", "bad"); return; }
  // plan categories

    if (changed) plan.push({ kind: "categories", id: data.id, data, before: ex || null, label: "หมวด: " + name, status: ex ? "แก้ไข" : "เพิ่มใหม่" });
    catByName[name] = data; if (!ex) newCats[data.id] = data;

  $("#repUpd").onclick = async e => { const b = e.target; b.disabled = true; b.textContent = "กำลังอัปเดต…"; try { const r = await Store.call("updateReports"); toast(`อัปเดตชีตแล้ว: ผู้ใช้ ${r.users} · ผลตรวจ ${r.checks} · อาชีวอนามัย ${r.occ} · การยศาสตร์ ${r.ergo} รายการ`, "ok"); } catch (err) { toast(errText(err), "bad"); } b.disabled = false; b.textContent = "↻ อัปเดตชีตรายงานตอนนี้"; };
  $("#uCsv").onclick = () => {
    const rows = [["ชื่อ", "ชื่อผู้ใช้", "หน่วยงาน", "ตำแหน่ง", "บทบาท", "สิทธิ์", "ลงทะเบียน", "เข้าใช้ล่าสุด", "สถานะ"], ...users.map(u => [u.name, u.username, u.dept, u.position, ROLE[u.role] || "ผู้ใช้", permLabel(u), u.createdAt ? thDate(u.createdAt) : "", u.lastLogin ? thDate(u.lastLogin) : "", u.active ? "ใช้งาน" : "ระงับ"])];
    const csv = "\ufeff" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    saveFile(`ผู้ใช้งาน_KHHC_${todayKey()}.csv`, new Blob([csv], { type: "text/csv" }));
  };
  $("#rcSave").onclick = async () => { try { const r = await Store.call("setRegisterCode", { code: $("#rcode").value }); S.usersD.registerCode = r.registerCode; toast("บันทึกรหัสลงทะเบียนแล้ว", "ok"); } catch (e) { toast(errText(e), "bad"); } };
  $$("[data-role]").forEach(sel => sel.onchange = async () => {
    try { await Store.call("setUser", { uid: sel.dataset.role, patch: { role: sel.value } }); toast("เปลี่ยนบทบาทแล้ว (มีผลเมื่อผู้ใช้เข้าระบบใหม่)", "ok"); S.usersD = null; rerender(); } catch (e) { toast(errText(e), "bad"); }
  });
  $$("[data-perm]").forEach(cb => cb.onchange = async () => {
    const uid = cb.dataset.perm; const perms = $$(`[data-perm="${uid}"]`).filter(x => x.checked).map(x => x.value);
    try { await Store.call("setUser", { uid, patch: { perms } }); toast("บันทึกสิทธิ์แล้ว (มีผลเมื่อผู้ใช้เข้าระบบใหม่)", "ok"); S.usersD = null; rerender(); } catch (e) { toast(errText(e), "bad"); cb.checked = !cb.checked; }
  });
  $$("[data-act]").forEach(b => b.onclick = async () => {
    const on = b.dataset.v === "1";
    if (!on && !(await confirmBox("ระงับบัญชี", "ผู้ใช้นี้จะเข้าสู่ระบบไม่ได้จนกว่าจะเปิดใช้อีกครั้ง", "ระงับ", true))) return;
    try { await Store.call("setUser", { uid: b.dataset.act, patch: { active: on } }); S.usersD = null; rerender(); } catch (e) { toast(errText(e), "bad"); }
  });
  $$("[data-rp]").forEach(b => b.onclick = async () => {
    const u = users.find(x => x.uid === b.dataset.rp);
    if (!(await confirmBox("รีเซ็ต PIN", `สร้าง PIN ชั่วคราวใหม่ให้ <b>${esc(u.name)}</b>?`, "รีเซ็ต"))) return;
    try { const r = await Store.call("resetPin", { uid: u.uid }); await confirmBox("PIN ชั่วคราว", `แจ้ง PIN นี้ให้ <b>${esc(u.name)}</b> (ชื่อผู้ใช้ ${esc(u.username)}) และให้เปลี่ยน PIN หลังเข้าระบบ<div style="font-size:34px;font-weight:700;letter-spacing:8px;text-align:center;margin:14px 0;color:var(--pink-700)">${esc(r.pin)}</div>`, "รับทราบ"); }
    catch (e) { toast(errText(e), "bad"); }
  });
}
async function loadUsers() {
  if (S._loadingUsers) return; S._loadingUsers = true;
  try { const [a, st] = await Promise.all([Store.call("users"), Store.call("stats")]); S.usersD = { users: a.users, registerCode: a.registerCode, stats: st }; }
  catch (e) { toast(errText(e), "bad"); S.usersD = { users: [], registerCode: "", stats: { total: 0, active7: 0, byRole: { staff: 0, admin: 0, user: 0 }, byDept: {} } }; }
  S._loadingUsers = false; rerender();
}

/* ---- History ---- */
function mHistory(body) {
  const h = S.history.slice(0, 200);
  body.innerHTML = `<div class="muted" style="margin-bottom:10px">บันทึกผู้แก้ไขและวันเวลาทุกครั้ง กด “กู้คืน” เพื่อย้อนข้อมูลกลับเป็นสถานะก่อนการแก้ไขนั้น (การกู้คืนจะถูกบันทึกเป็นประวัติด้วย)</div>
  ${h.length ? `<div class="tscroll"><table class="t"><thead><tr><th>วันเวลา</th><th>ผู้แก้ไข</th><th>การกระทำ</th><th>รายละเอียด</th><th></th></tr></thead><tbody>
  ${h.map(x => `<tr><td style="white-space:nowrap">${thDate(x.at)}</td><td>${esc(x.byName || nameOf(x.by))}</td><td><span class="tag ${x.action === "delete" ? "bad" : x.action === "create" ? "ok" : "pink"}">${ACT_TH[x.action] || esc(x.action)}${KIND_TH[x.kind] ? KIND_TH[x.kind] : ""}</span></td>
    <td>${esc(x.summary)}${x.kind === "foods" && x.before && x.after && x.before.carb !== x.after.carb ? `<div class="muted">คาร์บ ${fmt(num(x.before.carb))} → ${fmt(num(x.after.carb))} g</div>` : ""}</td>
    <td>${x.action === "restore" ? "" : `<button class="btn sec sm" data-rs="${esc(x.id)}">↩ กู้คืน</button>`}</td></tr>`).join("")}
  </tbody></table></div>` : `<div class="empty">ยังไม่มีประวัติการแก้ไข</div>`}`;
  $$("[data-rs]").forEach(b => b.onclick = async () => {
    const x = S.history.find(y => y.id === b.dataset.rs); if (!x) return;
    const path = x.kind === "app" ? "app/config" : `${x.kind}/${x.docId}`;
    const cur = x.kind === "app" ? S.config : x.kind === "foods" ? foodById(x.docId) : x.kind === "menus" ? S.menus.find(m => m.id === x.docId) : catById(x.docId);
    const what = x.before ? `ย้อน “${esc(x.summary)}” กลับเป็นข้อมูลก่อนแก้ไข` : `รายการนี้ถูก${ACT_TH[x.action]}ในครั้งนั้น การกู้คืนจะลบรายการออก`;
    if (!(await confirmBox("กู้คืนข้อมูล", what, "กู้คืน"))) return;
    try {
      if (x.before) {
        const data = { ...x.before };
        if (!("image" in data) && cur && "image" in cur) data.image = cur.image;
        if (x.kind === "app" && !("logo" in data) && cur) data.logo = cur.logo;
        data.updatedAt = Date.now(); data.updatedBy = S.uid;
        await Store.set(path, data);
        await logHistory(x.kind, x.docId, "restore", cur ? stripId(cur) : null, data, `กู้คืน: ${x.summary}`);
      } else {
        await Store.del(path);
        await logHistory(x.kind, x.docId, "restore", cur ? stripId(cur) : null, null, `กู้คืน (ลบ): ${x.summary}`);
      }
      toast("กู้คืนแล้ว", "ok");
    } catch (e) { toast(errText(e), "bad"); }
  });
}

</script>
