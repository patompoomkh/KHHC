<style>
:root{
  --pink-50:#FFF5F9; --pink-100:#FDE7F1; --pink-200:#F9CFE2; --pink-300:#F4A6C6; --pink-500:#E668A7; --pink-600:#D04E8F; --pink-700:#A93A73;
  --purple:#824097; --purple-100:#EFE3F5;
  --gray-50:#F7F6F8; --gray-100:#EFEDF1; --gray-200:#E2DFE6; --gray-300:#CCC8D2; --gray-500:#8A8492; --gray-700:#4D4855; --ink:#2E2A33;
  --ok:#2F9E6E; --ok-bg:#E3F5EC; --warn:#B7791F; --warn-bg:#FDF3DC; --bad:#C2414B; --bad-bg:#FCE6E8;
  --radius:16px; --shadow:0 2px 10px rgba(130,64,151,.08), 0 1px 2px rgba(0,0,0,.04);
  --font:"Noto Sans Thai","Sarabun","Tahoma",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--gray-50);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.3}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
a{color:var(--pink-700)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:12px;border:1px solid transparent;background:var(--pink-500);color:#fff;font-weight:600;cursor:pointer;transition:background .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--pink-600)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--pink-700);border-color:var(--pink-300)}
.btn.sec:hover{background:var(--pink-50)}
.btn.ghost{background:transparent;color:var(--gray-700);border-color:var(--gray-200)}
.btn.ghost:hover{background:var(--gray-100)}
.btn.danger{background:#fff;color:var(--bad);border-color:#F0B8BE}
.btn.danger:hover{background:var(--bad-bg)}
.btn.purple{background:var(--purple)}
.btn.purple:hover{background:#6c3480}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px;border-radius:10px}
.btn.icon{width:44px;padding:0}
.btn.sm.icon{width:36px}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}

/* form */
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--gray-700)}
.inp{min-height:44px;padding:8px 12px;border:1px solid var(--gray-300);border-radius:12px;background:#fff;font-size:16px;width:100%}
.inp:focus{border-color:var(--pink-500);outline:none;box-shadow:0 0 0 3px var(--pink-100)}
textarea.inp{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--gray-500);font-size:14px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--gray-100);color:var(--gray-700)}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.pink{background:var(--pink-100);color:var(--pink-700)}

/* auth screens */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,var(--pink-100),#fff 45%,var(--purple-100))}
.auth-card{width:100%;max-width:440px;background:#fff;border-radius:24px;box-shadow:0 10px 40px rgba(130,64,151,.15);padding:28px 24px}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:18px;text-align:center}
.logo-tile{background:#fff;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
.logo-tile img{display:block;max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto}
.auth-logo .logo-tile{width:132px;height:114px}
.brand-title{font-size:24px;font-weight:700;color:var(--purple)}
.brand-sub{color:var(--pink-700);font-weight:600}
.notice{border-radius:12px;padding:10px 14px;font-size:14px;background:var(--pink-50);border:1px solid var(--pink-200);color:var(--gray-700)}
.notice.warn{background:var(--warn-bg);border-color:#EED9A5}
.seg{display:flex;background:var(--gray-100);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:9px;font-weight:600;color:var(--gray-700);cursor:pointer}
.seg button.on{background:#fff;color:var(--pink-700);box-shadow:var(--shadow)}

/* app shell */
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--gray-200)}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px}
.topbar .logo-tile{width:54px;height:46px;border:1px solid var(--gray-100)}
.tb-brand{display:flex;flex-direction:column;line-height:1.2}
.tb-brand b{color:var(--purple);font-size:17px}
.tb-brand span{font-size:12.5px;color:var(--pink-700)}
.nav{max-width:1240px;margin:0 auto;display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--gray-700);font-weight:600;white-space:nowrap;font-size:15px}
.nav a:hover{background:var(--gray-100)}
.nav a.on{background:var(--pink-100);color:var(--pink-700)}
.userchip{display:flex;align-items:center;gap:8px;font-size:14px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--pink-200);color:var(--pink-700);display:grid;place-items:center;font-weight:700}
@media(max-width:640px){.tb-brand span,.userchip .uname{display:none}}
main{max-width:1240px;margin:0 auto;padding:18px 16px 60px}
.view-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.view-h h1{font-size:22px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--gray-100);padding:18px}
.card h2{font-size:18px;margin-bottom:10px}
.card h3{font-size:16px;margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.banner{margin-bottom:14px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:#fff;border-radius:var(--radius);padding:14px 16px;border:1px solid var(--gray-100);box-shadow:var(--shadow)}
.kpi .k{font-size:13.5px;color:var(--gray-500);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;margin:2px 0}
.kpi .v small{font-size:14px;color:var(--gray-500);font-weight:500}
.kpi.pink{background:linear-gradient(135deg,var(--pink-100),#fff)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-top:14px}
.dash-grid>*{min-width:0}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr}}

table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{text-align:left;font-weight:600;color:var(--gray-500);font-size:13px;padding:8px;border-bottom:1px solid var(--gray-200);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* carb page */
.carb-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media(max-width:980px){.carb-layout{grid-template-columns:1fr}}
.wheel-wrap{display:grid;grid-template-columns:minmax(260px,430px) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:760px){.wheel-wrap{grid-template-columns:1fr}}
.wheel-box{position:relative;width:100%;max-width:430px;margin:0 auto;aspect-ratio:1/1;touch-action:none;user-select:none;-webkit-user-select:none}
.wheel-box svg{width:100%;height:100%;display:block;overflow:visible}
.wheel-rot{transform-origin:200px 200px;transform-box:view-box}
.wheel-rot.anim{transition:transform .7s cubic-bezier(.2,.8,.25,1)}
.wheel-rot.spin{transition:transform 2.8s cubic-bezier(.12,.75,.18,1)}
.seg-path{cursor:pointer;stroke:#fff;stroke-width:3;transition:filter .2s}
.seg-path.sel{filter:brightness(1.04) drop-shadow(0 0 6px rgba(208,78,143,.55))}
.wheel-hub{pointer-events:none}
.wheel-ctrl{display:flex;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.cat-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat-dot{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:24px}
.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media(max-width:520px){.foods{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.food .ph{aspect-ratio:16/10!important;font-size:34px!important}.food .bd{padding:6px 8px 8px}.qty input{width:40px}.qty button{width:32px}.food .row{flex-direction:column;align-items:stretch}}
.mealbar{display:none}
@media(max-width:980px){.mealbar{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:40;align-items:center;gap:10px;background:var(--pink-600);color:#fff;border:0;border-radius:16px;padding:10px 16px;min-height:52px;box-shadow:0 8px 24px rgba(208,78,143,.35);font-weight:600;cursor:pointer}}
.food{background:#fff;border:1px solid var(--gray-200);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.food .ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:44px;position:relative}
.food .ph img{width:100%;height:100%;object-fit:cover;display:block}
.food .ph .rv{position:absolute;top:6px;left:6px}
.food .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.food .nm{font-weight:600;line-height:1.3}
.food .meta{font-size:13px;color:var(--gray-500)}
.food .cb{font-weight:700;color:var(--pink-700)}
.qty{display:flex;align-items:center;gap:4px}
.qty input{width:56px;text-align:center;min-height:36px;border:1px solid var(--gray-300);border-radius:10px;padding:2px}
.qty button{width:36px;height:36px;border-radius:10px;border:1px solid var(--pink-300);background:#fff;color:var(--pink-700);font-size:18px;font-weight:700;cursor:pointer}
.search{position:relative}
.search input{padding-left:38px}
.search::before{content:"🔎";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.6}

.meal-card{background:linear-gradient(160deg,#FCD9E8,#F9C2DA 60%,#F4A6C6);border-radius:20px;padding:18px;color:#5a1d3d;box-shadow:0 8px 24px rgba(230,104,167,.25);position:sticky;top:120px}
@media(max-width:980px){.meal-card{position:static}}
.meal-card h2{font-size:18px;margin-bottom:6px;color:#5a1d3d}
.meal-items{display:flex;flex-direction:column;gap:8px;margin:10px 0;max-height:46vh;overflow:auto}
.mi{background:rgba(255,255,255,.75);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.mi .n{font-weight:600}
.mi .s{font-size:13px;color:#7d4363}
.mi .c{font-weight:700;text-align:right}
.mi .ctl{grid-column:1/-1;display:flex;align-items:center;gap:6px;justify-content:space-between}
.meal-total{background:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.meal-total .big{font-size:34px;font-weight:700;color:var(--pink-700);line-height:1}
.formula{font-size:13px;background:rgba(255,255,255,.55);border-radius:10px;padding:6px 10px;margin-top:8px}

/* chips, lines editor, pick card */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:40px;padding:4px 14px;border-radius:999px;border:1px solid var(--gray-200);background:#fff;font-weight:600;color:var(--gray-700);cursor:pointer}
.chip span{font-weight:500;color:var(--gray-500);font-size:13px}
.chip.on{background:var(--pink-500);border-color:var(--pink-500);color:#fff}.chip.on span{color:#fde7f1}
.pick-card{background:linear-gradient(170deg,var(--pink-50),#fff 40%);border:1px solid var(--pink-200);border-radius:18px;padding:16px}
.pick-empty{text-align:center;padding:30px 16px;border:2px dashed var(--pink-200);border-radius:18px;background:var(--pink-50)}
.res-head{display:flex;gap:12px;align-items:center}
.res-ph{width:72px;height:72px;border-radius:16px;display:grid;place-items:center;font-size:38px;flex:none;overflow:hidden}
.res-ph img{width:100%;height:100%;object-fit:cover}
.res-total{text-align:center;background:#fff;border-radius:14px;padding:8px 12px;border:1px solid var(--pink-200);min-width:92px}
.res-total .big{font-size:30px;font-weight:700;color:var(--pink-700);line-height:1}
.le{border:1px solid var(--gray-200);border-radius:14px;padding:10px;background:#fff}
.le-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.le-rows{display:flex;flex-direction:column}
.le-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--gray-100);flex-wrap:wrap}
.le-row.miss{background:var(--bad-bg);border-radius:8px}
.le-ic{font-size:22px;width:28px;text-align:center}
.le-n{flex:1;min-width:140px}.le-n .nm{font-weight:600;line-height:1.3}.le-n .muted{font-size:12.5px}
.le-c{font-weight:700;color:var(--pink-700);min-width:58px;text-align:right}
.le-q{font-weight:600}
.le-add{margin-top:8px}
.le-res{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.le-hit{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border:1px solid var(--gray-200);border-radius:12px;background:#fff;cursor:pointer;min-height:48px}
.le-hit:hover{background:var(--pink-50);border-color:var(--pink-300)}
.le-hit > span:first-child{font-size:22px}
.le-cf{margin-top:8px;padding:10px;border-radius:12px;background:var(--gray-50)}
@media(max-width:520px){.res-head{flex-wrap:wrap}.res-head>div:nth-child(2){min-width:170px}.res-total{flex:1 1 100%;display:flex;align-items:baseline;justify-content:center;gap:8px}}
.tag{white-space:nowrap}

/* occupational */
.occ-sec{border:1px solid var(--gray-200);border-radius:14px;padding:12px;margin-bottom:12px;background:#fff;min-width:0}
.occ-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.occ-sec .chart,#occAudio .chart,#occLung .chart{max-width:640px}
.occ-sum{background:var(--pink-50);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14.5px}
table.occ-t td,table.occ-t th{text-align:center;white-space:nowrap}
.occ-fs{border:1px solid var(--pink-200);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;max-width:100%;box-sizing:border-box}
.crit{margin-bottom:16px}
.cr-msg{background:var(--pink-50);border:1px solid var(--pink-200);border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:4px;font-size:15.5px}
.cr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.cr-box{border:2px solid #1E5A96;border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column;gap:6px;padding-bottom:10px;min-width:0}
.cr-title{background:#1E5A96;color:#fff;font-weight:700;font-size:17px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cr-title small{font-weight:500;font-size:12.5px;opacity:.9}
.cr-tip{margin:0 10px;background:#DDF0FB;color:#1E5A96;border-radius:10px;padding:5px 10px;font-weight:600;font-size:14px;text-align:center}
.cr-tip.warn{background:#FCE1E4;color:#A61E33}
.cr-row{margin:0 10px;display:grid;grid-template-columns:34px 1fr minmax(0,1.25fr);align-items:center;gap:8px;background:var(--bg);border-left:6px solid var(--c);border-radius:12px;padding:6px 10px;position:relative}
.cr-n{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center;font-size:16px}
.cr-name{font-weight:700;font-size:15px}.cr-rng{font-size:13.5px;text-align:center;background:rgba(255,255,255,.75);border-radius:8px;padding:3px 6px;font-weight:600}
.cr-row.on,.cr-tile.on{outline:3px solid var(--c);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.cr-row .cr-you{grid-column:1/-1;justify-self:end}
.cr-you{display:inline-block;background:var(--c);color:#fff;font-weight:700;border-radius:999px;padding:2px 10px;font-size:13px;margin-top:2px}
.cr-g2{margin:0 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cr-gcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.cr-gh{background:#DDF0FB;color:#1E5A96;font-weight:700;text-align:center;border-radius:10px;padding:6px;font-size:14.5px;display:flex;flex-direction:column}
.cr-gh small{font-weight:500;font-size:12px}
.cr-tile{background:var(--bg);border-bottom:5px solid var(--c);border-radius:12px;padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.cr-tile b{font-size:24px;line-height:1.1}.cr-tile span{font-size:13px;font-weight:600;color:var(--gray-700)}
.dtxf .seg2{display:flex;gap:8px;flex-wrap:wrap}
.dtxf .seg2 label{flex:1;min-width:140px;display:flex;align-items:center;gap:8px;border:1px solid var(--gray-300);border-radius:12px;padding:8px 12px;min-height:46px;cursor:pointer;background:#fff;font-weight:600}
.dtxf .seg2 input{width:20px;height:20px;accent-color:var(--pink-500)}
.dtxf .seg2 label:has(input:checked){border-color:var(--pink-500);background:var(--pink-50)}
@media(max-width:420px){.cr-row{grid-template-columns:30px 1fr}.cr-rng{grid-column:1/-1}.cr-tile b{font-size:20px}}
@media print{.cr-row.on,.cr-tile.on{box-shadow:none}}
.recp{border:2px solid var(--pink-200);background:linear-gradient(180deg,#fff,var(--pink-50));margin-bottom:14px}
.recl{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.recr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--gray-200);border-radius:12px;padding:8px 10px}
.recr .li-main{flex:1;min-width:160px}.recr .nm{font-weight:700}
.myh{font-size:17px;margin:6px 0 10px;color:var(--gray-700)}
.occ-fs legend{font-weight:700;color:var(--purple);padding:0 6px}
.occ-grid{display:grid;gap:8px}
.vbox{border:1px solid var(--pink-100,#FBE3EE);background:var(--pink-50);border-radius:14px;padding:10px 12px;margin-top:8px;max-width:100%;box-sizing:border-box}
.vbox-h{font-weight:700;font-size:14.5px;color:var(--purple);margin-bottom:8px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.vt{background:#fff;border:1px solid var(--gray-200);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.vt span{font-size:12.5px;color:var(--gray-500)}.vt b{font-size:16px;word-break:break-word}
.vt.bad{border-color:var(--bad);background:var(--bad-bg)}.vt.bad b{color:var(--bad)}.vt.empty b{color:var(--gray-400)}
.vgrid .f{min-width:0}.vgrid .f .inp{width:100%;box-sizing:border-box}
@media(max-width:520px){.vgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.occ-grid .f span{font-size:13px}
.occ-in{min-height:40px;padding:4px 8px;text-align:center;min-width:64px}
table.occ-t .occ-in{width:68px}
.occ-res{max-width:420px;margin:4px 0 6px}
/* labs */
.labt td{vertical-align:middle}
.labt tr.labg td{background:var(--pink-50);font-weight:700;color:var(--purple);font-size:13.5px}
.labbar{width:200px;height:24px;display:block}
@media(max-width:640px){.labbar{width:130px}}
.labform{border:1px solid var(--pink-200);border-radius:14px;padding:10px 14px;background:#fff}
.labform summary{cursor:pointer;font-weight:700;color:var(--purple);min-height:32px;display:flex;align-items:center}
.labg2{grid-column:1/-1;font-weight:700;color:var(--purple);margin-top:6px;border-bottom:1px solid var(--pink-100)}
/* ergonomics */
.ergo-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media(max-width:900px){.ergo-wrap{grid-template-columns:1fr}}
.ergo-side{position:sticky;top:120px}
@media(max-width:900px){.ergo-side{position:sticky;bottom:0;top:auto;background:#fff;padding:8px 0;z-index:5;box-shadow:0 -6px 14px rgba(0,0,0,.06)}.ergo-side .ergo-parts{display:none}.ergo-side .ergo-res{padding:8px 12px}.ergo-side .ergo-score{font-size:30px}.ergo-side .row{margin-top:6px!important}}
.ergo-f{display:flex;flex-direction:column;gap:6px}
.ergo-l{font-weight:700;font-size:14.5px;color:var(--gray-700)}
.ergo-opts{display:flex;flex-wrap:wrap;gap:6px}
.ergo-o{min-height:42px;padding:6px 12px;border-radius:12px;border:1px solid var(--gray-300);background:#fff;font:inherit;font-size:14px;cursor:pointer;text-align:left}
.ergo-o b{color:var(--gray-500);font-weight:600}
.ergo-o.pic{display:flex;flex-direction:column;align-items:center;gap:2px;width:132px;text-align:center;padding:6px 6px 8px;position:relative;line-height:1.3}
.ergo-o .fig{width:96px;height:96px;background:#fff;border-radius:10px}
.ergo-o.pic.on{background:var(--pink-50);color:var(--pink-700);border:2px solid var(--pink-500)}.ergo-o.pic.on b{color:var(--pink-700)}
.ergo-o .tick{position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--pink-500);color:#fff;font-weight:800;display:none;align-items:center;justify-content:center;font-size:14px}
.ergo-o.pic.on .tick{display:flex}
.ergo-o:not(.pic) .tick{display:none}
@media(max-width:520px){.ergo-o.pic{width:calc(50% - 4px)}.ergo-o .fig{width:84px;height:84px}}
.ergo-o.on{background:var(--pink-500);border-color:var(--pink-500);color:#fff}.ergo-o.on b{color:#fde7f1}
.ergo-o.chk.on{background:var(--purple-100);border-color:var(--purple);color:var(--purple)}.ergo-o.chk.on b{color:var(--purple)}
.ergo-res{display:flex;gap:14px;align-items:center;border-radius:16px;padding:14px 16px;background:var(--gray-100)}
.ergo-res.ok{background:var(--ok-bg);color:#1f6b4a}.ergo-res.warn{background:var(--warn-bg);color:#7a5412}.ergo-res.bad{background:var(--bad-bg);color:#8f2a33}
.ergo-score{font-size:42px;font-weight:800;line-height:1}
.ergo-parts{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13.5px}
/* manage */
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--gray-200);margin-bottom:14px;scrollbar-width:none}
.tabs button{border:0;background:transparent;min-height:44px;padding:6px 14px;font-weight:600;color:var(--gray-500);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--pink-700);border-bottom-color:var(--pink-500)}
.list-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--gray-200);border-radius:14px;background:#fff}
.thumb{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.li-main{flex:1;min-width:0}
.li-main .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.color-in{width:52px;height:44px;padding:2px;border:1px solid var(--gray-300);border-radius:10px;background:#fff}
.emoji-pick{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.emoji-pick button{width:38px;height:38px;border-radius:10px;border:1px solid var(--gray-200);background:#fff;font-size:20px;cursor:pointer}
.emoji-pick button.on{border-color:var(--pink-500);background:var(--pink-50)}
.editor{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media(max-width:860px){.editor{grid-template-columns:1fr}}
.preview-pane{background:var(--gray-50);border:1px dashed var(--pink-300);border-radius:16px;padding:14px}
.imgdrop{border:2px dashed var(--pink-300);border-radius:14px;padding:12px;text-align:center;background:var(--pink-50);cursor:pointer}
.imgdrop img{max-width:100%;max-height:150px;border-radius:10px;display:block;margin:0 auto 8px}
.diff{font-size:13px;background:var(--gray-50);border-radius:10px;padding:8px 10px}
.diff del{color:var(--bad)} .diff ins{color:var(--ok);text-decoration:none;font-weight:600}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(46,42,51,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:700px){.modal-bg{align-items:center;padding:24px}}
.modal{background:#fff;width:100%;max-width:900px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
@media(min-width:700px){.modal{border-radius:22px}}
.modal.narrow{max-width:460px}
.modal-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-h h2{font-size:19px;flex:1}
.modal-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;position:sticky;bottom:-20px;background:#fff;padding:12px 0 4px}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:15px}
.toast.ok{background:#2a7d59} .toast.bad{background:#a8323b}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.empty{padding:24px;text-align:center;color:var(--gray-500)}

/* report */
.report{background:#fff;max-width:860px;margin:0 auto;border-radius:16px;box-shadow:var(--shadow);padding:28px}
.rep-head{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--pink-300);padding-bottom:14px;margin-bottom:16px}
.rep-head .logo-tile{width:96px;height:83px}
.rep-head h1{font-size:20px;color:var(--purple)}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--gray-500)}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid var(--pink-100);border-top-color:var(--pink-500);animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.wheel-rot.anim,.wheel-rot.spin{transition-duration:.01s}}
</style>
</head>

/* =================== Utils =================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeImg = v => (typeof v === "string" && /^data:image\/(png|jpe?g|webp|gif|svg\+xml);/i.test(v)) ? v : "";
const safeColor = v => (/^#[0-9a-f]{3,8}$/i.test(v || "") ? v : "#E2DFE6");
const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
const fmt = (n, d = 1) => { const x = Math.round(n * Math.pow(10, d)) / Math.pow(10, d); return x.toLocaleString("th-TH", { maximumFractionDigits: d }); };
const uid8 = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const thDate = t => new Date(t).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" });
const thDay = t => new Date(t).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" });
const todayKey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = msg;
  $("#toasts").appendChild(el);
  while ($('#toasts').children.length > 2) $('#toasts').firstChild.remove();
  setTimeout(() => el.remove(), 2600);
}
/* modal: returns {el, close} */
function openModal(html, { narrow = false, onClose } = {}) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal ${narrow ? "narrow" : ""}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const close = () => { bg.remove(); document.removeEventListener("keydown", onKey); onClose && onClose(); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  bg.addEventListener("mousedown", e => { if (e.target === bg) close(); });
  $$("[data-close]", bg).forEach(b => b.addEventListener("click", close));
  const f = $("input,select,textarea,button", bg.querySelector(".modal")); f && setTimeout(() => f.focus(), 30);
  return { el: bg, close };
}
function confirmBox(title, msg, okText = "ยืนยัน", danger = false) {
  return new Promise(res => {
    let done = false;
    const m = openModal(`<div class="modal-h"><h2>${esc(title)}</h2></div><div>${msg}</div>
      <div class="modal-f"><button class="btn ghost" data-no>ยกเลิก</button><button class="btn ${danger ? "danger" : ""}" data-yes>${esc(okText)}</button></div>`,
      { narrow: true, onClose: () => { if (!done) res(false); } });
    $("[data-no]", m.el).onclick = () => { done = true; m.close(); res(false); };
    $("[data-yes]", m.el).onclick = () => { done = true; m.close(); res(true); };
  });
}
function pickFile(accept) {
  return new Promise(res => {
    const inp = $("#filePick"); inp.value = ""; inp.accept = accept;
    inp.onchange = () => res(inp.files[0] || null);
    inp.click();
  });
}
const readAsDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
async function resizeImage(file, max = 360, q = .82) {
  const url = await readAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}

const MEM_KEY = window.KH_TEST ? "khhc-test-v1" : "khhc-demo";
/* =================== Data store (Backend DB หรือ โหมดทดลอง) =================== */
const Store = {
  kind: "mem", db: null, user: null, downloads: null,
  async init() {
    let db = null, user = null, downloads = null;
    if (typeof google !== "undefined" && google.script && google.script.run) {
      this.kind = "gas";
      try { this.token = localStorage.getItem("khhc-token"); } catch (e) { this.token = null; }
      return;
    }
    /* หน้าเว็บที่โฮสต์แยก (เช่น GitHub Pages) เรียก Apps Script ผ่าน /exec — ใช้ได้ทุกเบราว์เซอร์แม้ล็อกอิน Google หลายบัญชี */
    let api = String(window.KH_API_URL || "").trim();
    try { const q = new URLSearchParams(location.search).get("api"); if (q) { api = q.trim(); localStorage.setItem("khhc-api", api); } else if (!api) api = localStorage.getItem("khhc-api") || ""; } catch (e) { }
    if (/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(api)) {
      this.kind = "gas"; this.http = api;
      try { this.token = localStorage.getItem("khhc-token"); } catch (e) { this.token = null; }
      return;
    }
    if (window.KH_TEST) {
      if (typeof claude !== "undefined" && claude && claude.use) { try { this.downloads = await claude.use("downloads"); } catch (e) { } }
      this.memInit(); return;
    }
    if (typeof claude !== "undefined" && claude && claude.use) {
      try { [db, user, downloads] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]); } catch (e) { }
    }
    this.user = user; this.downloads = downloads;
    if (db) { this.kind = "db"; this.db = db; }
    else this.memInit();
  },
  /* ---------- in-browser demo store ---------- */
  mem: {}, memL: [],
  memInit() {
    try { this.mem = JSON.parse(localStorage.getItem(MEM_KEY) || "null") || null; } catch (e) { this.mem = null; }
    if (!this.mem) {
      this.mem = {};
      SEED.categories.forEach(c => this.mem["categories/" + c.id] = { ...c, updatedAt: Date.now(), updatedBy: "seed" });
      SEED.foods.forEach(f => this.mem["foods/" + f.id] = { ...f, updatedAt: Date.now(), updatedBy: "seed" });
      SEED.menus.forEach(m => this.mem["menus/" + m.id] = { ...m, updatedAt: Date.now(), updatedBy: "seed" });
    }
  },
  memSave() { try { localStorage.setItem(MEM_KEY, JSON.stringify(this.mem)); } catch (e) { } },
  memEmit() { this.memL.forEach(l => l.fire()); },
  memColl(path) {
    const depth = path.split("/").length + 1;
    return Object.entries(this.mem).filter(([k]) => k.startsWith(path + "/") && k.split("/").length === depth)
      .map(([k, v]) => ({ id: k.split("/").pop(), ...clone(v) }));
  },
  /* ---------- Google Apps Script backend ---------- */
  token: null, sh: { categories: [], foods: [], menus: [] }, shVer: 0, shLoaded: false, mineD: null, histD: null, histAt: 0, L: [], timer: null,
  setToken(t) { this.token = t; try { t ? localStorage.setItem("khhc-token", t) : localStorage.removeItem("khhc-token"); } catch (e) { } },
  http: "",
  call(action, payload) {
    const req = Object.assign({ action, token: this.token }, payload || {});
    const done = r => (r && r.error) ? Promise.reject({ code: r.code || "invalid", message: r.error }) : r;
    if (this.http) return fetch(this.http, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(req), redirect: "follow", cache: "no-store" })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .catch(() => Promise.reject({ code: "unavailable", message: "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่" }))
      .then(done)
      .catch(e => { if (e && e.code === "auth" && action !== "login" && action !== "register") onAuthLost(); throw e; });
    return new Promise((res, rej) => {
      google.script.run
        .withSuccessHandler(r => (r && r.error) ? rej({ code: r.code || "invalid", message: r.error }) : res(r))
        .withFailureHandler(e => rej({ code: "unavailable", message: String((e && e.message) || e) }))
        .api(req);
    }).catch(e => { if (e && e.code === "auth" && action !== "login" && action !== "register") onAuthLost(); throw e; });
  },
  gasEmit(path) { this.L.filter(l => !path || l.path === path).forEach(l => l.fire()); },
  gasData(path) {
    if (SHARED_COLLS.includes(path)) return this.shLoaded ? this.sh[path] : null;
    if (path === "history") return this.histD;
    const m = path.match(/^data\/users\/[^/]+\/profile\/(\w+)$/);
    if (m) return this.mineD ? (this.mineD[m[1]] || []) : null;
    return null;
  },
  async pullShared() {
    try { const r = await this.call("shared", { ver: this.shVer }); if (!r.same) { this.sh = r.docs; this.shVer = r.ver; this.shLoaded = true; SHARED_COLLS.forEach(c => this.gasEmit(c)); } }
    catch (e) { if (e.code !== "auth") { S.stale = true; rerender(); } }
  },
  async pullMine() { const r = await this.call("mine"); this.mineD = r.docs; ["meals", "checks", "mymenus", "occ", "ergo"].forEach(c => this.gasEmit(userBase() + "/" + c)); return r.docs; },
  async pullHistory(force) {
    if (!force && Date.now() - this.histAt < 15000) return;
    this.histAt = Date.now();
    try { const r = await this.call("history", { limit: 300 }); this.histD = r.docs; this.gasEmit("history"); } catch (e) { }
  },
  startSync() {
    this.stopSync();
    this.pullShared(); this.pullMine().catch(() => { });
    this.timer = setInterval(() => { if (!document.hidden) this.pullShared(); }, 60000);
    this._vis = () => { if (!document.hidden) this.pullShared(); };
    document.addEventListener("visibilitychange", this._vis);
  },
  stopSync() { clearInterval(this.timer); this.timer = null; if (this._vis) document.removeEventListener("visibilitychange", this._vis); },
  gasApply(path, doc) {
    const p = path.split("/");
    if (SHARED_COLLS.includes(p[0])) { const arr = this.sh[p[0]].filter(x => x.id !== p[1]); if (doc) arr.push({ ...doc, id: p[1] }); this.sh[p[0]] = arr; this.gasEmit(p[0]); clearTimeout(this._re); this._re = setTimeout(() => this.pullShared(), 2500); }
    else if (p[0] === "history") { if (doc && this.histD) { this.histD = [{ ...doc, id: p[1] }, ...this.histD]; this.gasEmit("history"); } }
    else if (p[0] === "data" && this.mineD) {
      if (p.length === 4) this.mineD.profile = doc;
      else { const c = p[4]; this.mineD[c] = (this.mineD[c] || []).filter(x => x.id !== p[5]); if (doc) this.mineD[c].push({ ...doc, id: p[5] }); this.gasEmit(p.slice(0, 5).join("/")); }
    }
  },
  /* ---------- API ---------- */
  listen(path, cb, err) {
    if (this.kind === "gas") {
      const l = { path, fire: () => { const d = this.gasData(path); if (d) cb(clone(d), { fromCache: false }); } };
      this.L.push(l); setTimeout(l.fire, 0);
      if (path === "history") this.pullHistory(true);
      return () => { this.L = this.L.filter(x => x !== l); };
    }
    if (this.kind === "db") {
      return this.db.collection(path).onSnapshot(s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })), s.metadata), e => err && err(e));
    }
    const l = { fire: () => cb(this.memColl(path), { fromCache: false }) };
    this.memL.push(l); setTimeout(l.fire, 0);
    return () => { this.memL = this.memL.filter(x => x !== l); };
  },
  listenDoc(path, cb, err) {
    if (this.kind === "gas") return () => { };
    if (this.kind === "db") return this.db.doc(path).onSnapshot(s => cb(s.exists ? s.data() : null, s.metadata), e => err && err(e));
    const l = { fire: () => cb(clone(this.mem[path]) || null, { fromCache: false }) };
    this.memL.push(l); setTimeout(l.fire, 0);
    return () => { this.memL = this.memL.filter(x => x !== l); };
  },
  async get(path) {
    if (this.kind === "gas") { if (!this.mineD) await this.pullMine(); return path.endsWith("/profile") ? clone(this.mineD.profile) : null; }
    if (this.kind === "db") { const s = await this.db.doc(path).get(); return s.exists ? s.data() : null; }
    return clone(this.mem[path]) || null;
  },
  async set(path, data) {
    if (this.kind === "gas") { const r = await this.call("set", { path, data }); this.gasApply(path, r.doc || data); return; }
    if (this.kind === "db") return withRetry(() => this.db.doc(path).set(data));
    this.mem[path] = clone(data); this.memSave(); this.memEmit();
  },
  async del(path) {
    if (this.kind === "gas") { await this.call("del", { path }); this.gasApply(path, null); return; }
    if (this.kind === "db") return withRetry(() => this.db.doc(path).delete());
    delete this.mem[path]; this.memSave(); this.memEmit();
  }
};
async function withRetry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === "unavailable") { await sleep(400 + Math.random() * 600); return fn(); }
    throw e;
  }
}
function errText(e) {
  const c = e && e.code;
  if (c === "invalid_argument") return "ไม่มีสิทธิ์บันทึก หรือข้อมูลไม่ถูกต้อง";
  if (c === "forbidden") return (e && e.message) || "ไม่มีสิทธิ์ทำรายการนี้";
  if (c === "invalid" || c === "locked") return (e && e.message) || "ข้อมูลไม่ถูกต้อง";
  if (c === "auth") return "หมดเวลาการเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่";
  if (c === "unavailable" && e && e.message) return "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่";
  if (c === "quota_exceeded") return "พื้นที่ฐานข้อมูลเต็ม กรุณาลบข้อมูลเก่าหรือรูปภาพขนาดใหญ่";
  if (c === "resource_exhausted") return "มีการบันทึกถี่เกินไป กรุณารอสักครู่แล้วลองใหม่";
  return "บันทึกไม่สำเร็จ กรุณาลองใหม่";
}

/* =================== Boot =================== */
(async function boot() {
  await Store.init();
  if (Store.kind === "gas") {
    $("#boot").remove();
    if (Store.token) {
      try { const r = await Store.call("me"); await applyLogin(r); return; }

      S.isStaff = !!(own || ed);

function subscribeShared() {
  if (S._sharedSub) return; S._sharedSub = true;
  const timer = setTimeout(() => { if (!S.loaded.foods) { S.stale = true; rerender(); } }, 10000);
  subs.push(Store.listen("categories", (rows, meta) => {
    S.categories = rows; S.loaded.categories = true;
    if (!S.selCat || !catById(S.selCat)) S.selCat = (catsSorted()[0] || {}).id || null;
    rerender();
  }, e => { clearTimeout(timer); S.loaded.categories = true; rerender(); }));
  subs.push(Store.listen("foods", (rows, meta) => {
    S.foods = rows; S.loaded.foods = true;
    if (!meta || !meta.fromCache) { clearTimeout(timer); S.stale = false; }
    rerender();
  }, e => { clearTimeout(timer); S.loaded.foods = true; rerender(); }));
  subs.push(Store.listen("menus", rows => { S.menus = rows; if (!S.spinning) rerender(); }));
}
function subscribeStaff() {
  if (S._staffSub) return; S._staffSub = true;
  subs.push(Store.listen("history", rows => {
    S.history = rows.sort((a, b) => num(b.at) - num(a.at));
    resolveNames(S.history.map(h => h.by));
    if (S.view === "manage" && S.mtab === "history") rerender();
  }));
}
function subscribeUser() {
  userSubs.forEach(u => u()); userSubs.length = 0;
  userSubs.push(Store.listen(userBase() + "/meals", rows => { S.meals = rows.sort((a, b) => num(b.at) - num(a.at)); rerender(); }));
  userSubs.push(Store.listen(userBase() + "/mymenus", rows => { S.myMenus = rows.map(r => ({ ...r, mine: true })); if (!S.spinning) rerender(); }));
  if (Store.kind === "gas") userSubs.push(Store.listen(userBase() + "/occ", rows => { S.occ = rows; rerender(); }));
  if (Store.kind === "gas") userSubs.push(Store.listen(userBase() + "/ergo", rows => { S.ergo = rows; rerender(); }));
  userSubs.push(Store.listen(userBase() + "/checks", rows => { S.checks = rows.sort((a, b) => String(a.date).localeCompare(String(b.date)) || num(a.at) - num(b.at)); rerender(); }));
}

async function resolveNames(ids) {

  if (!need.length) return;
  need.forEach(id => S.names[id] = "");
  if (Store.kind === "gas") {
    if (!staff()) return;
    try { const r = await Store.call("names", { ids: need.filter(i => i !== "seed") }); Object.assign(S.names, r.names || {}); } catch (e) { }
    if (S.view === "manage") rerender(); return;
  }
  if (Store.kind !== "db") { need.forEach(id => S.names[id] = id === "seed" ? "ข้อมูลตั้งต้น" : (S.profile?.name || "ผู้ใช้ในเครื่องนี้")); return; }
  try {
    const ps = await Store.user.profiles(need);
    need.forEach(id => S.names[id] = (ps && ps[id] && ps[id].name) || (id === S.uid ? (S.profile?.name || "") : ""));
  } catch (e) { }
  if (S.view === "manage") rerender();

function bpLevel(s, d) {
  s = num(s); d = num(d); if (!s && !d) return null;
  const ls = !s ? 0 : s >= 180 ? 6 : s >= 160 ? 5 : s >= 140 ? 4 : s >= 130 ? 3 : s >= 120 ? 2 : 1;
  const ld = !d ? 0 : d >= 110 ? 6 : d >= 100 ? 5 : d >= 90 ? 4 : d >= 85 ? 3 : d >= 80 ? 2 : 1;
  return BP_LV[Math.max(ls, ld) - 1];   /* ค่าบนหรือค่าล่างอยู่ต่างระดับ ใช้ระดับที่สูงกว่า */
}

         { n: 3, r: "≥126", act: "สงสัยโรคเบาหวาน", name: "สงสัยเบาหวาน", cls: "bad", col: "#F08A24", bg: "#FFEEDC" }],
  non: [{ n: 1, r: "70–139", act: "ตรวจคัดกรองซ้ำทุก 1 ปี", name: "ปกติ", cls: "ok", col: "#6BBF3A", bg: "#EFF8E4" },
        { n: 2, r: "140–199", act: "ปรับเปลี่ยนพฤติกรรม", name: "เสี่ยง", cls: "warn", col: "#D9A400", bg: "#FFF7D6" },
        { n: 3, r: "≥200", act: "สงสัยโรคเบาหวาน", name: "สงสัยเบาหวาน", cls: "bad", col: "#F08A24", bg: "#FFEEDC" }]
};
const GLU_LOW = { n: 0, r: "<70", act: "น้ำตาลต่ำ ควรพบเจ้าหน้าที่", name: "ต่ำ", cls: "warn" };
/* fast: true = อดอาหาร ≥8 ชม. (FBS หรือ DTX ที่ระบุว่าอดอาหาร) */
function gluLevel(v, fast) {
  v = num(v); if (!v) return null; if (v < 70) return GLU_LOW;
  const t = fast ? GLU.fast : GLU.non;
  return fast ? (v >= 126 ? t[2] : v >= 100 ? t[1] : t[0]) : (v >= 200 ? t[2] : v >= 140 ? t[1] : t[0]);
}
const dtxIsFast = c => !c || String(c.dtxFast) !== "2";   /* ไม่ระบุ = ใช้เกณฑ์อดอาหาร (เข้มกว่า) */
const lvTag = (lv, short) => lv ? `<span class="tag ${lv.cls}">${esc(short || lv.name)}</span>` : "";
function bpTag(s, d) { const lv = bpLevel(s, d); return lv ? lvTag(lv, lv.n >= 4 ? "สูง ระดับ " + (lv.n - 3) : lv.name) : ""; }
function fbsTag(v) { return lvTag(gluLevel(v, true)); }
function dtxTag(v, fastFlag) { return lvTag(gluLevel(v, String(fastFlag) !== "2")); }
const dtxFastLabel = c => c && c.dtx ? (String(c.dtxFast) === "2" ? "ไม่อดอาหาร" : String(c.dtxFast) === "1" ? "อดอาหาร ≥8 ชม." : "") : "";
function dtxFastHTML(val) {
  val = String(val || "");
  return `<div class="f dtxf"><span>DTX ตรวจตอน</span><div class="seg2">
    <label><input type="radio" name="dtxFast" value="1" ${val === "1" ? "checked" : ""}><span>อดอาหาร ≥8 ชม.</span></label>
    <label><input type="radio" name="dtxFast" value="2" ${val === "2" ? "checked" : ""}><span>ไม่อดอาหาร</span></label></div></div>`;
}
/* การ์ดเกณฑ์สำหรับผู้รับบริการ — ไฮไลต์ระดับของค่าล่าสุด */
function critCardHTML(L, opts = {}) {
  L = L || {};
  const bl = bpLevel(L.sbp, L.dbp);
  const fbsL = gluLevel(L.fbs, true);
  const dF = L.dtx ? dtxIsFast(L) : null, dL = L.dtx ? gluLevel(L.dtx, dF) : null;
  const you = (txt) => `<span class="cr-you">◀ คุณ ${txt}</span>`;
  const bpRows = BP_LV.map(lv => `<div class="cr-row ${bl && bl.n === lv.n ? "on" : ""}" style="--c:${lv.col};--bg:${lv.bg}">
      <span class="cr-n">${lv.n}</span><span class="cr-name">${lv.name}</span><span class="cr-rng">${lv.range}</span>
      ${bl && bl.n === lv.n ? you(`${esc(L.sbp || "–")}/${esc(L.dbp || "–")}`) : ""}</div>`).join("");
  const col = (key, title, sub) => {
    const fast = key === "fast";
    const marks = []; if (fast && fbsL) marks.push(["FBS", L.fbs, fbsL]); if (dL && dF === fast) marks.push(["DTX", L.dtx, dL]);
    return `<div class="cr-gcol"><div class="cr-gh">${title}${sub ? `<small>${sub}</small>` : ""}</div>
      ${GLU[key].map(g => { const m = marks.filter(x => x[2] === g); return `<div class="cr-tile ${m.length ? "on" : ""}" style="--c:${g.col};--bg:${g.bg}"><b>${g.r}</b><span>${g.act}</span>${m.map(x => you(`${x[0]} ${esc(x[1])}`)).join("")}</div>`; }).join("")}</div>`;
  };
  const low = [fbsL === GLU_LOW ? `FBS ${esc(L.fbs)}` : "", dL === GLU_LOW ? `DTX ${esc(L.dtx)}` : ""].filter(Boolean);
  const msg = [];
  if (bl) msg.push(`ความดันโลหิต <b>${esc(L.sbp || "–")}/${esc(L.dbp || "–")}</b> มม.ปรอท อยู่ในระดับ <b style="color:${bl.col}">${bl.n}. ${bl.name}</b>`);
  if (fbsL) msg.push(`น้ำตาลอดอาหาร (FBS) <b>${esc(L.fbs)}</b> มก./ดล. — <b>${fbsL.act}</b>`);
  if (dL) msg.push(`น้ำตาลปลายนิ้ว (DTX) <b>${esc(L.dtx)}</b> มก./ดล. ${L.dtxFast ? `(${dtxFastLabel(L)})` : `<span class="muted">(ไม่ได้ระบุการอดอาหาร ใช้เกณฑ์อดอาหาร)</span>`} — <b>${dL.act}</b>`);
  return `<div class="card crit">${opts.noTitle ? "" : `<h2>📋 เกณฑ์ความดันโลหิตและน้ำตาลในเลือด</h2>`}

/* ค่าล่าสุดของแต่ละรายการจากประวัติผลตรวจ */
function latestVitals(checks) {
  const s = [...(checks || [])].sort((a, b) => String(a.date).localeCompare(String(b.date)) || num(a.at) - num(b.at));
  const L = {}; const pick = (k, extra) => { for (let i = s.length - 1; i >= 0; i--) if (num(s[i][k]) > 0) { L[k] = s[i][k]; (extra || []).forEach(x => { if (s[i][x] != null) L[x] = s[i][x]; }); return s[i].date; } };
  const d1 = pick("sbp", ["dbp"]), d2 = pick("fbs"), d3 = pick("dtx", ["dtxFast"]);
  L.date = [d1, d2, d3].filter(Boolean).sort().pop();
  return L;
}

const lastWith = k => [...S.checks].reverse().find(c => num(c[k]) > 0);
const todayCarb = () => S.meals.filter(m => todayKey(m.at) === todayKey()).reduce((s, m) => s + num(m.total), 0);

function lineChart(points, { color = "#E668A7", unit = "" } = {}) {
  if (points.length < 2) return `<div class="empty">ต้องมีข้อมูลอย่างน้อย 2 ครั้งจึงแสดงแนวโน้ม</div>`;
  const W = 560, H = 190, P = { l: 40, r: 14, t: 14, b: 28 };
  const ys = points.map(p => p.y), lo = Math.min(...ys), hi = Math.max(...ys), pad = (hi - lo) * .15 || 1;
  const y0 = lo - pad, y1 = hi + pad;
  const X = i => P.l + i * (W - P.l - P.r) / (points.length - 1);
  const Y = v => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
  const d = points.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const ticks = [y0 + pad, (y0 + y1) / 2, y1 - pad];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">
    ${ticks.map(t => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#EFEDF1"/><text x="${P.l - 6}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="#8A8492">${fmt(t)}</text>`).join("")}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${points.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" fill="#fff" stroke="${color}" stroke-width="2"><title>${esc(p.x)}: ${fmt(p.y)} ${unit}</title></circle>`).join("")}
    ${points.map((p, i) => (points.length <= 8 || i % Math.ceil(points.length / 6) === 0 || i === points.length - 1) ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#8A8492">${esc(p.x)}</text>` : "").join("")}
  </svg></div>`;
}

/* =================== Wheel (generic) =================== */
function arcPath(cx, cy, r0, r1, a0, a1) {
  const p = (r, a) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  const large = a1 - a0 > 180 ? 1 : 0;
  const [x0, y0] = p(r1, a0), [x1, y1] = p(r1, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0);
  return `M${x0} ${y0} A${r1} ${r1} 0 ${large} 1 ${x1} ${y1} L${x2} ${y2} A${r0} ${r0} 0 ${large} 0 ${x3} ${y3} Z`;
}
const shortName = (n, max) => { n = String(n || ""); return n.length > max ? n.slice(0, max - 1) + "…" : n; };
function wheelSVG(items, { selId = null, rot = 0, hub = true, hubText = "" } = {}) {
  const N = items.length;
  if (!N) return `<svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="190" fill="#EFEDF1"/><text x="200" y="205" text-anchor="middle" font-size="16" fill="#8A8492">ยังไม่มีรายการ</text></svg>`;
  const step = 360 / N;
  const radial = N > 8;
  const segs = items.map((c, i) => {
    const a0 = i * step, a1 = (i + 1) * step, mid = a0 + step / 2;
    const screen = ((mid + rot) % 360 + 360) % 360; // where the label sits on screen → keep text readable
    const d = N === 1 ? `M200 10 A190 190 0 1 1 199.9 10 Z` : arcPath(200, 200, 58, 190, a0, a1);
    let label;
    if (radial) {
      const name = shortName(c.name, 16);
      const fs = Math.max(9, Math.min(14, 104 / Math.max(4, name.length * .58), step * .5));
      label = `<text x="200" y="${200 - 113}" text-anchor="middle" dominant-baseline="middle" font-size="${fs.toFixed(1)}" font-weight="700" fill="#3c2a40" transform="rotate(${screen > 180 ? 90 : -90} 200 ${200 - 113})">${esc(name)}</text>`;
    } else {
      const name = shortName(c.name, 14);
      const arcLen = 2 * Math.PI * 118 * step / 360;
      const fs = Math.max(9, Math.min(15, arcLen / Math.max(4, name.length * .62)));
      label = `<text x="200" y="${200 - 116}" text-anchor="middle" dominant-baseline="middle" font-size="${fs.toFixed(1)}" font-weight="700" fill="#3c2a40"${screen > 100 && screen < 260 ? ` transform="rotate(180 200 ${200 - 116})"` : ""}>${esc(name)}</text>`;
    }
    return `<g data-i="${i}">
      <path class="seg-path ${c.id === selId ? "sel" : ""}" data-i="${i}" d="${d}" fill="${safeColor(c.color)}"><title>${esc(c.name)}</title></path>
      <g transform="rotate(${mid} 200 200)" pointer-events="none">
        <text x="200" y="${200 - 168}" text-anchor="middle" dominant-baseline="middle" font-size="${Math.min(26, step * .5)}">${esc(c.icon || "🍽️")}</text>
        ${label}
      </g></g>`;
  }).join("");
  const sel = items.find(c => c.id === selId);
  return `<svg viewBox="0 0 400 400" aria-label="วงล้อ">
    <defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#824097" flood-opacity=".18"/></filter></defs>
    <circle cx="200" cy="200" r="196" fill="#fff" filter="url(#sh)"/>
    <g class="wheel-rot" style="transform:rotate(${rot}deg)">${segs}</g>
    ${hub ? `<g class="wheel-hub"><circle cx="200" cy="200" r="54" fill="#fff" stroke="#F9CFE2" stroke-width="4"/>
      <text x="200" y="${sel ? 190 : 200}" text-anchor="middle" dominant-baseline="middle" font-size="${sel ? 26 : 14}" ${sel ? "" : `font-weight="700" fill="#A93A73"`}>${sel ? esc(sel.icon || "🍽️") : esc(hubText || "หมุนเลย!")}</text>
      ${sel ? `<text x="200" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#A93A73">${esc(shortName(sel.name, 12))}</text>` : ""}</g>` : ""}
    <path d="M200 30 L186 2 L214 2 Z" fill="#824097" stroke="#fff" stroke-width="2"/>
  </svg>`;
}
const norm = a => ((a % 360) + 360) % 360;
function indexAtPointer(rot, N) { return Math.floor(norm(-rot) / (360 / N)) % N; }
function rotFor(i, N, cur) { const target = -(i + .5) * 360 / N; return target + Math.round((cur - target) / 360) * 360; }
function animWheel(cls) {
  const g = $("#wheelBox .wheel-rot"); if (!g) return;
  g.classList.remove("anim", "spin"); if (cls) { void g.getBoundingClientRect(); g.classList.add(cls); }
  g.style.transform = `rotate(${S.wheelRot}deg)`;
}
function bindWheel(box, items, onSelect) {
  const N = items.length; if (!N) return;
  let drag = null;
  const center = () => { const r = box.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const angle = (x, y) => { const [cx, cy] = center(); return Math.atan2(x - cx, -(y - cy)) * 180 / Math.PI; };
  box.onpointerdown = e => {
    if (e.button > 0 || S.spinning) return;
    drag = { a: angle(e.clientX, e.clientY), r: S.wheelRot, moved: 0, t: e.target };
    box.setPointerCapture(e.pointerId); animWheel();
  };
  box.onpointermove = e => {
    if (!drag) return;
    let da = angle(e.clientX, e.clientY) - drag.a;
    if (da > 180) da -= 360; if (da < -180) da += 360;
    drag.moved = Math.max(drag.moved, Math.abs(da));
    S.wheelRot = drag.r + da; animWheel();
  };
  const end = () => {
    if (!drag) return;
    const d = drag; drag = null;
    let idx;
    if (d.moved < 4 && d.t && d.t.dataset && d.t.dataset.i != null) { S.wheelRot = d.r; idx = +d.t.dataset.i; }
    else idx = indexAtPointer(S.wheelRot, N);
    S.wheelRot = rotFor(idx, N, S.wheelRot); animWheel("anim");
    setTimeout(() => onSelect(items[idx]), 300);
  };
  box.onpointerup = end; box.onpointercancel = end;
  box.onkeydown = e => {
    const cur = Math.max(0, items.findIndex(c => c.id === S.selMenu));
    let n = null;
    if (e.key === "ArrowRight" || e.key === "ArrowDown") n = (cur + 1) % N;
    if (e.key === "ArrowLeft" || e.key === "ArrowUp") n = (cur - 1 + N) % N;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); spinWheel(items, onSelect); return; }
    if (n != null) { e.preventDefault(); S.wheelRot = rotFor(n, N, S.wheelRot); animWheel("anim"); setTimeout(() => onSelect(items[n]), 300); }
  };
}
function spinWheel(items, onSelect) {
  const N = items.length; if (!N || S.spinning) return;
  const i = Math.floor(Math.random() * N);
  const target = -(i + .5) * 360 / N;
  const base = S.wheelRot + 1080 + Math.random() * 360;
  S.wheelRot = target + Math.ceil((base - target) / 360) * 360;
  S.spinning = true; animWheel("spin");
  const b = $("#btnSpin"); if (b) { b.disabled = true; b.textContent = "กำลังหมุน…"; }
  setTimeout(() => { S.spinning = false; onSelect(items[i]); }, 2850);
}

function lineInfo(l) {

      <div class="formula">สูตร: คาร์บรวม = คาร์บต่อหน่วย × จำนวนหน่วย · เป้าหมาย ${fmt(goal)} g/มื้อ ${rows.length ? (total > goal ? `<b style="color:#a8323b">· เกินเป้า ${fmt(total - goal)} g</b>` : `<b style="color:#2a7d59">· อยู่ในเป้า</b>`) : ""}</div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" id="mealClear" ${rows.length ? "" : "disabled"} style="background:#fff">ล้าง</button><span class="spacer"></span><button class="btn" id="mealSave" ${rows.length ? "" : "disabled"}>บันทึกมื้อนี้</button></div>
      ${S.meals.length ? `<div style="margin-top:14px"><b>บันทึกล่าสุด</b>${S.meals.slice(0, 4).map(m => `<div class="s" style="font-size:13.5px;margin-top:4px">${thDate(m.at)} · ${esc(m.mealType)} · <b>${fmt(num(m.total))} g</b></div>`).join("")}</div>` : ""}
    </aside>
  </div>`;
  $$("[data-ct]").forEach(b => b.onclick = () => { S.ctab = b.dataset.ct; rerender(); });
  const body = $("#cbody");
  if (!S.loaded.foods) body.innerHTML = `<div class="empty"><div class="spinner"></div>กำลังโหลดฐานข้อมูลอาหาร…</div>`;
  else ({ wheel: carbWheel, calc: carbCalc, db: carbDB }[S.ctab] || carbWheel)(body);
  // meal card
  const mb = $("#mealBar"); if (mb) mb.onclick = () => $("#mealCard").scrollIntoView({ behavior: "smooth" });
  $$("[data-mq]").forEach(b => b.onclick = () => { const m = S.meal[+b.dataset.mq]; m.qty = Math.max(.5, num(m.qty) + num(b.dataset.d)); rerender(); });
  $$("[data-mqi]").forEach(i => i.onchange = () => { const m = S.meal[+i.dataset.mqi]; m.qty = Math.max(.25, num(i.value, m.qty)); rerender(); });
  $$("[data-mdel]").forEach(b => b.onclick = () => { S.meal.splice(+b.dataset.mdel, 1); rerender(); });
  $("#mealType").onchange = e => S.mealType = e.target.value;
  $("#mealClear").onclick = () => { S.meal = []; rerender(); };
  $("#mealSave").onclick = async () => {
    const rs = mealRows();
    const data = { at: Date.now(), mealType: S.mealType, total: Math.round(rs.reduce((s, r) => s + r.total, 0) * 10) / 10,
      items: rs.map(r => { const src = S.meal[r.idx]; return { foodId: src.foodId || "", name: r.name, unit: r.unit, carb: Math.round(r.carb * 10) / 10, qty: r.qty, total: Math.round(r.total * 10) / 10, ...(src.lines ? { lines: src.lines } : {}) }; }) };
    try { await Store.set(userBase() + "/meals/" + uid8(), data); S.meal = []; toast(`บันทึกมื้อ${data.mealType} ${fmt(data.total)} g แล้ว`, "ok"); rerender(); }
    catch (err) { toast(errText(err), "bad"); }
  };
}

/* ---- tab: wheel ---- */
function carbWheel(body) {
  const items = wheelItems();
  const groupCount = g => g === "all" ? S.menus.length : g === "mine" ? S.myMenus.length : S.menus.filter(m => m.group === g).length;
  if (S.selMenu && !items.some(m => m.id === S.selMenu)) { S.selMenu = null; S.pick = null; }
  const selIdx = items.findIndex(m => m.id === S.selMenu);
  if (selIdx >= 0 && !S.spinning && indexAtPointer(S.wheelRot, items.length) !== selIdx) S.wheelRot = rotFor(selIdx, items.length, S.wheelRot);
  const poolSize = S.menuGroup === "mine" ? S.myMenus.length : groupCount(S.menuGroup);
  body.innerHTML = `
    <div class="chips">${[["all", "ทั้งหมด"], ...MENU_GROUPS.map(g => [g, g]), ["mine", "⭐ เมนูของฉัน"]].map(([k, l]) => `<button class="chip ${S.menuGroup === k ? "on" : ""}" data-mg="${esc(k)}">${esc(l)} <span>${groupCount(k)}</span></button>`).join("")}</div>
    ${!items.length ? `<div class="empty">${S.menuGroup === "mine" ? "ยังไม่มีเมนูของฉัน — สร้างได้ที่แท็บ “คำนวณคาร์บเมนูของฉัน”" : "ยังไม่มีเมนูในหมวดนี้"}${staff() && S.menuGroup !== "mine" ? `<br><button class="btn sm" style="margin-top:8px" id="goMenus">เพิ่มเมนูบนวงล้อ</button>` : ""}</div>` : `
    <div class="wheel-wrap">
      <div>
        <div class="wheel-box" id="wheelBox" tabindex="0" aria-label="วงล้อเมนูอาหาร กด Enter เพื่อหมุน ลูกศรเพื่อเลือกเมนู">${wheelSVG(items, { selId: S.selMenu, rot: S.wheelRot, hubText: "กินอะไรดี?" })}</div>
        <div class="wheel-ctrl"><button class="btn purple" id="btnSpin" style="min-width:180px;font-size:17px">🎡 หมุนวงล้อ</button>
          ${poolSize > 12 ? `<button class="btn ghost" id="btnReshuffle">🔀 สุ่มชุดใหม่ (${poolSize} เมนู)</button>` : ""}</div>
        <div class="muted" style="text-align:center;margin-top:6px">ไม่รู้จะทานอะไร? กดหมุน หรือแตะ/ลากเลือกเมนูเองได้</div>
      </div>
      <div id="pickBox"></div>
    </div>`}`;
  $$("[data-mg]").forEach(b => b.onclick = () => { S.menuGroup = b.dataset.mg; S.selMenu = null; S.pick = null; S.wheelSet = null; rerender(); });
  const gm = $("#goMenus"); if (gm) gm.onclick = () => { S.mtab = "menus"; location.hash = "#manage"; };
  if (!items.length) return;
  const onSel = m => pickMenu(m);
  bindWheel($("#wheelBox"), items, onSel);
  $("#btnSpin").onclick = () => spinWheel(items, onSel);
  const rs = $("#btnReshuffle"); if (rs) rs.onclick = () => { S.wheelSet = null; S.wheelSetKey = null; S.selMenu = null; S.pick = null; rerender(); };
  const pb = $("#pickBox");
  if (!S.pick || S.pick.id !== S.selMenu) {
    const live = S.selMenu && menuById(S.selMenu);
    if (live) S.pick = { ...clone(live), ingredients: clone(live.ingredients || []), seasonings: clone(live.seasonings || []) };
  }
  if (!S.pick) {
    pb.innerHTML = `<div class="pick-empty"><div style="font-size:54px">🎡</div><h2 style="font-size:19px">กินอะไรดีวันนี้?</h2><p class="muted">กดปุ่ม “หมุนวงล้อ” ระบบจะสุ่มเมนู พร้อมแสดงวัตถุดิบ เครื่องปรุง ปริมาณ และคาร์บของเมนูนั้น</p>
      <p class="muted">มีอาหารอยู่แล้ว? ไปที่ <a href="#" id="toCalc">คำนวณคาร์บเมนูของฉัน</a></p></div>`;
    $("#toCalc").onclick = e => { e.preventDefault(); S.ctab = "calc"; rerender(); };
    return;
  }
  const p = S.pick, orig = menuById(p.id);
  const paintHead = () => { $("#pickHead").innerHTML = menuResultHTML(p, menuTotals(p), { badge: `<span class="tag pink">🎉 วงล้อเลือกให้แล้ว</span>` }); };
  pb.innerHTML = `<div class="pick-card"><div id="pickHead"></div>
    <div class="muted" style="margin:8px 0">ปรับจำนวนได้ตามที่ทานจริง เช่น ลดข้าวเหลือ 1 ทัพพี ระบบคำนวณคาร์บใหม่ทันที</div>
    <div id="leIng"></div><div id="leSea" style="margin-top:10px"></div>
    ${p.note ? `<div class="notice" style="margin-top:10px">💡 ${esc(p.note)}</div>` : ""}
    <div class="row" style="margin-top:12px"><button class="btn ghost sm" id="pkReset">↺ คืนค่าตามสูตร</button><span class="spacer"></span><button class="btn sec" id="pkCalc">🧮 แก้ไขต่อในเครื่องคำนวณ</button><button class="btn" id="pkAdd">➕ เพิ่มลงมื้อนี้</button></div></div>`;
  paintHead();
  LinesEditor($("#leIng"), p.ingredients, { title: "วัตถุดิบ", onChange: paintHead });
  LinesEditor($("#leSea"), p.seasonings, { title: "เครื่องปรุง", prefer: "cat-sauce", onChange: paintHead });
  $("#pkReset").onclick = () => { S.pick = null; rerender(); };
  $("#pkAdd").onclick = () => addMenuToMeal(p);
  $("#pkCalc").onclick = () => { S.calc = { name: p.name, ingredients: clone(p.ingredients), seasonings: clone(p.seasonings) }; S.ctab = "calc"; rerender(); };
}

/* ---- tab: calculator ---- */
function carbCalc(body) {
  const c = S.calc;
  const q = c.name.trim();
  const sugg = q ? [...S.menus, ...S.myMenus].filter(m => String(m.name).includes(q) || q.includes(String(m.name))).slice(0, 5) : [];
  body.innerHTML = `<div class="stack">
    <div><h2 style="margin-bottom:4px">🧮 มีอาหารอยู่แล้ว อยากรู้คาร์บ?</h2><div class="muted">ใส่ชื่ออาหาร แล้วเพิ่มวัตถุดิบและเครื่องปรุงพร้อมปริมาณ ระบบคำนวณคาร์บให้ทันที</div></div>
    <label class="f">ชื่ออาหาร<input class="inp" id="calcName" value="${esc(c.name)}" placeholder="เช่น ข้าวผัดกุ้ง, แกงเขียวหวานไก่" autocomplete="off"></label>
    <div id="calcSugg"></div>
    <div id="calcHead"></div>
    <div id="leIng2"></div><div id="leSea2"></div>
    <div class="row"><button class="btn ghost" id="calcClear">ล้างทั้งหมด</button><span class="spacer"></span>
      <button class="btn sec" id="calcSaveMine">⭐ บันทึกเป็นเมนูของฉัน</button>
      ${staff() ? `<button class="btn sec" id="calcSaveWheel">🎡 เพิ่มลงวงล้อกลาง</button>` : ""}
      <button class="btn" id="calcAdd">➕ เพิ่มลงมื้อนี้</button></div>
  </div>`;
  const paintSugg = () => {
    const q2 = c.name.trim();
    const ss = q2 ? [...S.menus, ...S.myMenus].filter(m => String(m.name).includes(q2) || q2.includes(String(m.name))).slice(0, 5) : [];
    $("#calcSugg").innerHTML = ss.length ? `<div class="notice">พบเมนูในระบบ: ${ss.map(m => `<button type="button" class="btn sm sec" data-usem="${esc(m.id)}" style="margin:4px 4px 0 0">${esc(m.icon || "🍽️")} ใช้สูตร “${esc(m.name)}” (${fmt(menuTotals(m).carb)} g)</button>`).join("")}</div>` : "";
    $$("[data-usem]").forEach(b => b.onclick = () => { const m = menuById(b.dataset.usem); c.name = m.name; c.ingredients = clone(m.ingredients || []); c.seasonings = clone(m.seasonings || []); rerender(); });
  };
  const paintHead = () => {
    const t = menuTotals(c);
    $("#calcHead").innerHTML = c.ingredients.length + c.seasonings.length ? `<div class="pick-card" style="padding:12px">${menuResultHTML({ name: c.name || "อาหารของฉัน", icon: "🍽️", color: "#F9CFE2", serving: "" }, t)}</div>` : "";
  };
  void sugg;
  paintSugg(); paintHead();
  $("#calcName").oninput = e => { c.name = e.target.value; paintSugg(); paintHead(); };
  LinesEditor($("#leIng2"), c.ingredients, { title: "วัตถุดิบ", onChange: paintHead });
  LinesEditor($("#leSea2"), c.seasonings, { title: "เครื่องปรุง", prefer: "cat-sauce", onChange: paintHead });
  $("#calcClear").onclick = () => { S.calc = { name: "", ingredients: [], seasonings: [] }; rerender(); };
  $("#calcAdd").onclick = () => addMenuToMeal({ name: c.name || "อาหารของฉัน", ingredients: c.ingredients, seasonings: c.seasonings });
  $("#calcSaveMine").onclick = async () => {
    if (!c.name.trim()) return toast("กรุณาใส่ชื่ออาหาร", "bad");
    if (!c.ingredients.length && !c.seasonings.length) return toast("กรุณาเพิ่มวัตถุดิบ", "bad");
    const ex = S.myMenus.find(m => m.name === c.name.trim());
    const id = ex ? ex.id : "my-" + uid8();
    const data = { name: c.name.trim(), group: "เมนูของฉัน", icon: "⭐", color: MENU_PAL[S.myMenus.length % MENU_PAL.length], serving: "1 จาน/ที่", ingredients: cleanLines(c.ingredients), seasonings: cleanLines(c.seasonings), updatedAt: Date.now() };
    try { await Store.set(userBase() + "/mymenus/" + id, data); toast(ex ? "อัปเดตเมนูของฉันแล้ว" : "บันทึกเมนูของฉันแล้ว — หมุนได้ในหมวด ⭐", "ok"); }
    catch (e) { toast(errText(e), "bad"); }
  };
  const sw = $("#calcSaveWheel");
  if (sw) sw.onclick = () => {
    if (!c.name.trim()) return toast("กรุณาใส่ชื่ออาหาร", "bad");
    menuEditor(null, { name: c.name.trim(), ingredients: cleanLines(c.ingredients), seasonings: cleanLines(c.seasonings) });
  };
}

/* ---- tab: ingredient DB browse ---- */
function carbDB(body) {
  const cats = catsSorted();
  if (!S.selCat || !catById(S.selCat)) S.selCat = cats[0]?.id || null;
  const sel = catById(S.selCat);
  const q = S.foodQuery.trim().toLowerCase();
  const list = q ? S.foods.filter(f => String(f.name).toLowerCase().includes(q)).sort((a, b) => String(a.name).localeCompare(b.name, "th")) : (sel ? foodsIn(sel.id) : []);
  body.innerHTML = `<div class="search" style="margin-bottom:10px"><input class="inp" id="foodSearch" placeholder="ค้นหาวัตถุดิบ/อาหารทุกหมวด…" value="${esc(S.foodQuery)}"></div>
    <div class="chips">${cats.map(c => `<button class="chip ${!q && c.id === S.selCat ? "on" : ""}" data-sc="${esc(c.id)}" style="--cc:${safeColor(c.color)}">${esc(c.icon)} ${esc(c.name)} <span>${foodsIn(c.id).length}</span></button>`).join("")}</div>
    ${q ? `<div class="cat-head"><h2 style="margin:0;font-size:18px">ผลการค้นหา “${esc(S.foodQuery)}”</h2><span class="muted">${list.length} รายการ</span></div>` : ""}
    ${list.length ? `<div class="foods">${list.map(f => foodCardHTML(f)).join("")}</div>` : `<div class="empty">ไม่มีรายการ</div>`}`;
  $("#foodSearch").oninput = e => { S.foodQuery = e.target.value; rerender(); };
  $$("[data-sc]").forEach(b => b.onclick = () => { S.selCat = b.dataset.sc; S.foodQuery = ""; rerender(); });
  $$("[data-dq]").forEach(b => b.onclick = () => { const i = $("#q-" + CSS.escape(b.dataset.dq)); i.value = Math.max(.5, num(i.value, 1) + num(b.dataset.d)); });
  $$("[data-add]").forEach(b => b.onclick = () => {
    const f = foodById(b.dataset.add); if (!f) return;
    const qty = Math.max(.25, num($("#q-" + CSS.escape(f.id)).value, 1));
    const ex = S.meal.find(m => m.foodId === f.id);
    if (ex) ex.qty = num(ex.qty) + qty; else S.meal.push({ foodId: f.id, name: f.name, unit: f.unit, carb: num(f.carb), qty });
    toast(`เพิ่ม ${f.name} × ${fmt(qty)} = ${fmt(num(f.carb) * qty)} g`, "ok");
    rerender();
  });
}

/* ---- staff: menu manager ---- */
function mMenus(body) {
  const list = menusSorted();
  body.innerHTML = `<div class="editor">
    <div><div class="row" style="margin-bottom:10px"><h2 style="margin:0;font-size:18px">เมนูบนวงล้อ “กินอะไรดี”</h2><span class="spacer"></span><button class="btn" id="addMenu">+ เพิ่มเมนู</button></div>
      <div class="stack" style="gap:8px">${list.map((m, i) => { const t = menuTotals(m); const img = safeImg(m.image); return `<div class="list-item">
        <div class="thumb" style="background:${safeColor(m.color)}">${img ? `<img src="${img}" alt="">` : esc(m.icon || "🍽️")}</div>
        <div class="li-main"><div class="nm">${esc(m.name)}</div><div class="muted">${esc(m.group || "-")} · วัตถุดิบ ${(m.ingredients || []).length} · เครื่องปรุง ${(m.seasonings || []).length} · <b style="color:var(--pink-700)">${fmt(t.carb)} g</b>${t.missing ? ` · <span style="color:var(--bad)">ขาด ${t.missing}</span>` : ""}</div></div>
        ${m.reviewed ? `<span class="tag ok">ทบทวนแล้ว</span>` : `<span class="tag warn">รอทบทวน</span>`}
        <button class="btn ghost sm icon" data-mu="${i}" ${i === 0 ? "disabled" : ""} aria-label="เลื่อนขึ้น">↑</button>
        <button class="btn ghost sm icon" data-md="${i}" ${i === list.length - 1 ? "disabled" : ""} aria-label="เลื่อนลง">↓</button>
        <button class="btn sec sm" data-em="${esc(m.id)}">แก้ไข</button>
        <button class="btn danger sm icon" data-xm="${esc(m.id)}" aria-label="ลบ ${esc(m.name)}">🗑</button></div>`; }).join("") || `<div class="empty">ยังไม่มีเมนู${SEED.menus ? ` <button class="btn sm sec" id="loadSeedM">โหลดเมนูตัวอย่าง ${SEED.menus.length} เมนู</button>` : ""}</div>`}</div></div>
    <div class="preview-pane"><div style="font-weight:700;margin-bottom:8px;color:var(--pink-700)">วงล้อปัจจุบัน (ทั้งหมด)</div><div style="max-width:340px;margin:0 auto">${wheelSVG(list.slice(0, 12), { hub: false })}</div>${list.length > 12 ? `<div class="muted" style="text-align:center">วงล้อแสดงครั้งละ 12 เมนู ผู้ใช้กด “สุ่มชุดใหม่” เพื่อเปลี่ยนชุด</div>` : ""}</div>
  </div>`;
  $("#addMenu").onclick = () => menuEditor(null);
  const ls = $("#loadSeedM"); if (ls) ls.onclick = loadSeedData;
  $$("[data-em]").forEach(b => b.onclick = () => menuEditor(S.menus.find(m => m.id === b.dataset.em)));
  $$("[data-xm]").forEach(b => b.onclick = async () => {
    const m = S.menus.find(x => x.id === b.dataset.xm); if (!m) return;
    if (!(await confirmBox("ลบเมนู", `ลบ <b>${esc(m.name)}</b> ออกจากวงล้อ? กู้คืนได้จากประวัติการแก้ไข`, "ลบ", true))) return;
    try { await removeEntity("menus", m.id, m, `ลบเมนู ${m.name}`); toast("ลบแล้ว", "ok"); } catch (e) { toast(errText(e), "bad"); }
  });
  const move = async (i, j) => {
    try {
      for (let k = 0; k < list.length; k++) {
        const m = list[k]; let want = k + 1; if (k === i) want = j + 1; else if (k === j) want = i + 1;
        if (num(m.order) !== want) await writeEntity("menus", m.id, { ...m, order: want }, m, `เปลี่ยนลำดับเมนู ${m.name} → ${want}`);
      }
      toast("เปลี่ยนลำดับแล้ว", "ok");
    } catch (e) { toast(errText(e), "bad"); }
  };
  $$("[data-mu]").forEach(b => b.onclick = () => move(+b.dataset.mu, +b.dataset.mu - 1));
  $$("[data-md]").forEach(b => b.onclick = () => move(+b.dataset.md, +b.dataset.md + 1));
}
function menuEditor(orig, prefill) {

  d.ingredients = d.ingredients || []; d.seasonings = d.seasonings || [];
  const m = openModal(`<div class="modal-h"><h2>${orig ? "แก้ไขเมนูบนวงล้อ" : "เพิ่มเมนูบนวงล้อ"}</h2><button class="btn ghost sm icon" data-close aria-label="ปิด">✕</button></div>
  <form class="editor" id="me" novalidate>
    <div class="stack">
      <label class="f">ชื่อเมนู *<input class="inp" name="name" value="${esc(d.name)}"></label>
      <div class="grid2">
        <label class="f">ประเภทเมนู<select class="inp" name="group">${MENU_GROUPS.map(g => `<option ${g === d.group ? "selected" : ""}>${g}</option>`).join("")}</select></label>
        <label class="f">ปริมาณที่เสิร์ฟ<input class="inp" name="serving" value="${esc(d.serving)}" placeholder="1 จาน / 1 ชาม"></label>
      </div>

  { g: "การทำงานของตับ", k: "alt", name: "SGPT (ALT)", unit: "IU/L", max: 120,

  { g: "การทำงานของตับ", k: "alp", name: "อัลคาไลน์ฟอสฟาเตส (ALP)", unit: "U/L", max: 250,
    range: s => s === "m" ? "40 – 130 (ชาย)" : s === "f" ? "35 – 105 (หญิง)" : "ชาย 40–130 · หญิง 35–105",
    bands: s => { const [lo, hi] = s === "f" ? [35, 105] : [40, 130]; return [[0, lo, WARN, "ต่ำกว่าปกติ"], [lo, hi + 0.0001, OK, "ปกติ"], [hi + 0.0001, 1e9, BAD, "สูงกว่าปกติ"]]; } },

];
const LAB_KEYS = LABS.map(l => l.k);
function labInterp(l, v, sex) {
  if (v === "" || v == null || !Number.isFinite(parseFloat(v))) return null;
  const x = parseFloat(v); const b = l.bands(sexKey(sex)).find(([a, z]) => x >= a && x < z) || l.bands(sexKey(sex)).slice(-1)[0];
  return { cls: b[2], t: b[3] };
}
const labTag = r => r ? `<span class="tag ${r.cls}">${esc(r.t)}</span>` : "";
/* eGFR ตามสมการ CKD-EPI 2021 (ไม่ใช้เชื้อชาติ) ต้องมี Cr เพศ และอายุ */
function egfrCalc(cr, sex, birthYearBE) {
  const s = sexKey(sex), c = parseFloat(cr), by = parseInt(birthYearBE, 10);
  if (!s || !(c > 0) || !(by > 2400)) return null;
  const age = new Date().getFullYear() + 543 - by; if (age < 18 || age > 110) return null;
  const k = s === "f" ? 0.7 : 0.9, a = s === "f" ? -0.241 : -0.302;
  const v = 142 * Math.pow(Math.min(c / k, 1), a) * Math.pow(Math.max(c / k, 1), -1.2) * Math.pow(0.9938, age) * (s === "f" ? 1.012 : 1);
  return Math.round(v);
}
/* แถบช่วงค่า (กราฟอัตโนมัติ) */
function labBar(l, v, sex) {
  const bands = l.bands(sexKey(sex)), max = l.max, x = parseFloat(v);
  const W = 220, H = 26, pos = val => Math.max(0, Math.min(W, val / max * W));
  const col = { ok: "#B9E3C6", warn: "#F6DFA0", bad: "#F2B4BA" };
  const segs = bands.map(([a, z, c]) => { const x0 = pos(a), x1 = pos(Math.min(z, max)); return x1 > x0 ? `<rect x="${x0}" y="8" width="${x1 - x0}" height="10" fill="${col[c]}"/>` : ""; }).join("");
  const m = Number.isFinite(x) ? `<path d="M${pos(x)} 4 L${pos(x) - 5} -3 L${pos(x) + 5} -3 Z" fill="#2E2A33" transform="translate(0,4)"/><line x1="${pos(x)}" x2="${pos(x)}" y1="6" y2="20" stroke="#2E2A33" stroke-width="2"/>` : "";
  return `<svg viewBox="-6 -2 ${W + 12} ${H}" class="labbar" aria-hidden="true"><rect x="0" y="8" width="${W}" height="10" rx="5" fill="#EFEDF1"/>${segs}${m}</svg>`;
}
function labsOf(c) { return LABS.filter(l => c && c[l.k] !== undefined && c[l.k] !== "" && c[l.k] != null); }
function labTableHTML(c, sex, { bars = true } = {}) {
  const ls = labsOf(c); if (!ls.length) return "";
  let g0 = "";

function labFormHTML(vals, sex) {

/* อ่านค่าแล็บจากฟอร์ม → เพิ่มลงข้อมูลผลตรวจ */
function readLabs(fd, data, profile) {
  LABS.forEach(l => { const v = String(fd[l.k] ?? "").trim(); if (v !== "" && Number.isFinite(parseFloat(v)) && parseFloat(v) >= 0) data[l.k] = parseFloat(v); });
  if (data.egfr == null && data.cr) { const e = egfrCalc(data.cr, profile?.sex, profile?.birthYear); if (e) { data.egfr = e; data.egfrCalc = 1; } }
  return data;
}
function labSummaryCard(checks, sex) {

  const ks = LABS.filter(l => L[l.k]); if (!ks.length) return "";
  const abn = ks.filter(l => { const r = labInterp(l, L[l.k].v, sex); return r && r.cls !== "ok"; });
  return `<div class="card"><h2>🧪 ผลตรวจทางห้องปฏิบัติการล่าสุด</h2>

function labBadge(c, sex) {

  const n = ls.filter(l => { const r = labInterp(l, c[l.k], sex); return r && r.cls !== "ok"; }).length;
  return n ? `<span class="tag warn">🧪 ผิดปกติ ${n}/${ls.length}</span>` : `<span class="tag ok">🧪 ปกติ ${ls.length}</span>`;
